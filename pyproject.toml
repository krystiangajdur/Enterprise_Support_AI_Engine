[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ai-engine"
version = "0.1.0"
description = "Enterprise Customer Support AI Engine with Hybrid RAG + SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "langchain",
    "langchain-community",
    "chromadb",
    "pypdf",
    "sentence-transformers",
    "langchain-huggingface",
    "langchain-chroma",
    "langchain-google-genai",
    "fastapi",
    "uvicorn",
    "slowapi"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]